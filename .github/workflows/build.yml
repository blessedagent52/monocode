name: Build

# Unsigned test builds for every desktop platform, downloadable from the run's
# artifacts. Release signing, notarization and the updater feed stay in
# release.yml, so this needs no secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: monocode-macos-arm64
            bundles: app,dmg
            paths: |
              target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            artifact: monocode-linux-x64
            bundles: deb,appimage
            paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            artifact: monocode-windows-x64
            bundles: nsis
            paths: |
              target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      # Updater artifacts need the release signing key; test builds skip them.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/tauri.build.conf.json"
          npx tauri build --bundles "${{ matrix.bundles }}" --config "$RUNNER_TEMP/tauri.build.conf.json"
          if [[ "$RUNNER_OS" == "Linux" ]]; then bash scripts/repack-appimage.sh; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
